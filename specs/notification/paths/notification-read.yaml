patch:
  operationId: "markNotificationRead"
  # prettier-ignore
  summary: |-
    Mark a notification as read

  tags:
    - "Notifications"

  security:
    - BearerAuth: []

  parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"

  responses:
    "200":
      # prettier-ignore
      description: |-
        The updated notification
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Notification.yaml"

    "401":
      $ref: "../../shared/components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../shared/components/responses/NotFound.yaml"
