get:
  operationId: "getCart"
  # prettier-ignore
  summary: |-
    Get the current shopping cart

  tags:
    - "Orders"

  security:
    - BearerAuth: []

  responses:
    "200":
      # prettier-ignore
      description: |-
        Current cart
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Cart.yaml"

    "401":
      $ref: "../../shared/components/responses/Unauthorized.yaml"

post:
  operationId: "checkoutCart"
  # prettier-ignore
  summary: |-
    Convert the current cart into an order

  tags:
    - "Orders"

  security:
    - BearerAuth: []

  parameters:
    - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"

  responses:
    "201":
      # prettier-ignore
      description: |-
        Created order
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Order.yaml"

    "409":
      $ref: "../../shared/components/responses/Conflict.yaml"
