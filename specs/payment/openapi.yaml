openapi: "3.1.2"

info:
  version: "0.1.0"
  title: "Payment Service API"
  termsOfService: "https://octalmesh.com/articles/terms"
  contact:
    name: "OctalMesh Support"
    url: "https://octalmesh.com"
    email: "contact@octalmesh.com"
  license:
    name: "MIT"
    url: "https://opensource.org/license/MIT"

servers:
  - url: "/api"

tags:
  - name: "Payments"
    description: "Payment transaction operations."
  - name: "Webhooks"
    description: "Payment provider callback operations."

paths:
  /payments:
    $ref: "./paths/payments.yaml"
  /webhooks/provider:
    $ref: "./paths/webhook.yaml"

components:
  securitySchemes:
    BearerAuth:
      $ref: "../shared/components/security/bearerAuth.yaml"

  schemas:
    Payment:
      $ref: "./components/schemas/Payment.yaml"
    WebhookEvent:
      $ref: "./components/schemas/WebhookEvent.yaml"

  parameters:
    IdempotencyKey:
      $ref: "../shared/components/parameters/IdempotencyKeyHeader.yaml"
