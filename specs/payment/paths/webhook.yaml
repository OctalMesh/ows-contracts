post:
  operationId: "receivePaymentWebhook"
  # prettier-ignore
  summary: |-
    Receive a payment provider callback
  security: []

  tags:
    - "Webhooks"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/WebhookEvent.yaml"

  responses:
    "204":
      # prettier-ignore
      description: |-
        Webhook accepted

    "400":
      $ref: "../../shared/components/responses/BadRequest.yaml"
