get:
  operationId: "getMyCustomOrderRequest"
  # prettier-ignore
  summary: |-
    Get a single custom-order request

  tags:
    - "CustomOrders"

  security:
    - BearerAuth: []

  parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"

  responses:
    "200":
      # prettier-ignore
      description: |-
        Request
      content:
        application/json:
          schema:
            $ref: "../components/schemas/CustomOrderRequest.yaml"

    "401":
      $ref: "../../shared/components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../shared/components/responses/NotFound.yaml"
