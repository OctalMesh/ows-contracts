type: "object"
required:
  - "amount"
  - "currency"

properties:
  amount:
    type: "integer"
    format: "int64"
    # prettier-ignore
    description: |-
      Amount in the smallest currency unit.

  currency:
    type: "string"
    pattern: "^[A-Z]{3}$"
    # prettier-ignore
    description: |-
      ISO 4217 currency code.
