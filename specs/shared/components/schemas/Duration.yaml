type: "object"
# prettier-ignore
description: |-
  A unit-agnostic span of time. Kept unit-explicit rather than a fixed suffix
  (e.g. always "days") so callers never have to guess what a bare number means;
  presentation (rounding, pluralization, unit conversion, locale formatting) is
  left entirely to the client.

required:
  - "value"
  - "unit"

properties:
  value:
    type: "integer"
    minimum: 0

  unit:
    type: "string"
    enum:
      - "minutes"
      - "hours"
      - "days"
      - "weeks"
