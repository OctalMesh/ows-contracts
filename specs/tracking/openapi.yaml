openapi: "3.1.2"

info:
  version: "0.1.0"
  title: "Tracking Service API"
  termsOfService: "https://octalmesh.com/articles/terms"
  contact:
    name: "OctalMesh Support"
    url: "https://octalmesh.com"
    email: "contact@octalmesh.com"
  license:
    name: "MIT"
    url: "https://opensource.org/license/MIT"

servers:
  - url: "/api"

tags:
  - name: "Tracking"
    # prettier-ignore
    description: |-
      Customer-facing order fulfillment pipeline (a simplified view onto the
