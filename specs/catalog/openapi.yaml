openapi: "3.1.2"

info:
  version: "0.1.0"
  title: "Catalog Service API"
  termsOfService: "https://octalmesh.com/articles/terms"
  contact:
    name: "OctalMesh Support"
    url: "https://octalmesh.com"
    email: "contact@octalmesh.com"
  license:
    name: "MIT"
    url: "https://opensource.org/license/MIT"

servers:
  - url: "/api"

tags:
  - name: "Products"
    # prettier-ignore
    description: |-
      Product catalog, variant configuration, and availability.

paths:
  /products:
    $ref: "./paths/products.yaml"
  /products/{id}:
    $ref: "./paths/product-by-id.yaml"

components:
  schemas:
    Product:
      $ref: "./components/schemas/Product.yaml"
    ProductSummary:
      $ref: "./components/schemas/ProductSummary.yaml"
    ProductPage:
      $ref: "./components/schemas/ProductPage.yaml"
    ProductAttribute:
      $ref: "./components/schemas/ProductAttribute.yaml"
    ProductAttributeValue:
      $ref: "./components/schemas/ProductAttributeValue.yaml"
    ProductVariant:
      $ref: "./components/schemas/ProductVariant.yaml"
    Availability:
      $ref: "./components/schemas/Availability.yaml"

  parameters:
    Limit:
      $ref: "../shared/components/parameters/LimitParam.yaml"
    Page:
      $ref: "../shared/components/parameters/PageParam.yaml"
    Locale:
      $ref: "../shared/components/parameters/LocaleParam.yaml"
    Currency:
      $ref: "../shared/components/parameters/CurrencyParam.yaml"

  responses:
    BadRequest:
      $ref: "../shared/components/responses/BadRequest.yaml"
    NotFound:
      $ref: "../shared/components/responses/NotFound.yaml"
