post:
  operationId: "completeOAuthLogin"
  # prettier-ignore
  summary: |-
    Exchange an OAuth authorization code for tokens, creating the identity on
    first use
  security: []

  tags:
    - "Auth"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/OAuthCallbackRequest.yaml"

  responses:
    "200":
      # prettier-ignore
      description: |-
        Successful authentication
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Token.yaml"

    "401":
      $ref: "../../shared/components/responses/Unauthorized.yaml"
