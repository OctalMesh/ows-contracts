post:
  operationId: "refreshToken"
  # prettier-ignore
  summary: |-
    Exchange a refresh token for a new token pair
  security: []

  tags:
    - "Auth"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/RefreshRequest.yaml"

  responses:
    "200":
      # prettier-ignore
      description: |-
        New token pair (old refresh token is revoked)
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Token.yaml"

    "401":
      $ref: "../../shared/components/responses/Unauthorized.yaml"
