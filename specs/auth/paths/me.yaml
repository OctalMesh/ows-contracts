get:
  operationId: "getCurrentUser"
  # prettier-ignore
  summary: |-
    Get the authenticated user profile

  tags:
    - "Auth"

  security:
    - BearerAuth: []

  responses:
    "200":
      # prettier-ignore
      description: |-
        The current user
      content:
        application/json:
          schema:
            $ref: "../components/schemas/User.yaml"

    "401":
      $ref: "../../shared/components/responses/Unauthorized.yaml"
