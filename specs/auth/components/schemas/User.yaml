type: "object"
# prettier-ignore
description: |-
  Authentication identity only - who can log in, and how. Profile details
  (display name, preferences) live in the user service; this service
  deliberately knows nothing about them, keeping the credential surface as small
  as possible.

required:
  - "id"
  - "createdAt"

properties:
  id:
    type: "string"
    format: "uuid"

  email:
    type: "string"
    format: "email"

  emailVerified:
    type: "boolean"

  phone:
    type: "string"

  phoneVerified:
    type: "boolean"

  linkedProviders:
    type: "array"
    items:
      type: "string"
      enum:
        - "google"

  createdAt:
    type: "string"
    format: "date-time"
