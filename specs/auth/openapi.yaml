openapi: "3.1.2"

info:
  version: "0.1.0"
  title: "Auth Service API"
  termsOfService: "https://octalmesh.com/articles/terms"
  contact:
    name: "OctalMesh Support"
    url: "https://octalmesh.com"
    email: "contact@octalmesh.com"
  license:
    name: "MIT"
    url: "https://opensource.org/license/MIT"

servers:
  - url: "/api"

tags:
  - name: "Auth"
    description: "Authentication and user profile operations."

paths:
  /login:
    $ref: "./paths/login.yaml"
  /register:
    $ref: "./paths/register.yaml"
  /me:
    $ref: "./paths/me.yaml"

components:
  schemas:
    User:
      $ref: "./components/schemas/User.yaml"
    Token:
      $ref: "./components/schemas/Token.yaml"
    LoginRequest:
      $ref: "./components/schemas/LoginRequest.yaml"

  securitySchemes:
    BearerAuth:
      $ref: "../shared/components/security/bearerAuth.yaml"
