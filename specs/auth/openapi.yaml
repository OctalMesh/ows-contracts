openapi: "3.1.2"

info:
  version: "0.1.0"
  title: "Auth Service API"
  termsOfService: "https://octalmesh.com/articles/terms"
  contact:
    name: "OctalMesh Support"
    url: "https://octalmesh.com"
    email: "contact@octalmesh.com"
  license:
    name: "MIT"
    url: "https://opensource.org/license/MIT"

servers:
  - url: "/api"

tags:
  - name: "Auth"
    # prettier-ignore
    description: |-
      Passwordless authentication (email/SMS one-time codes and OAuth)
      and identity lookup. We never store passwords.

paths:
  /otp/request:
    $ref: "./paths/otp-request.yaml"
  /otp/verify:
    $ref: "./paths/otp-verify.yaml"
  /oauth/callback:
    $ref: "./paths/oauth-callback.yaml"
  /refresh:
    $ref: "./paths/refresh.yaml"
  /logout:
    $ref: "./paths/logout.yaml"
  /me:
    $ref: "./paths/me.yaml"

components:
  schemas:
    User:
      $ref: "./components/schemas/User.yaml"
    Token:
      $ref: "./components/schemas/Token.yaml"
    OtpRequest:
      $ref: "./components/schemas/OtpRequest.yaml"
    OtpVerify:
      $ref: "./components/schemas/OtpVerify.yaml"
    OAuthCallbackRequest:
      $ref: "./components/schemas/OAuthCallbackRequest.yaml"
    RefreshRequest:
      $ref: "./components/schemas/RefreshRequest.yaml"

  securitySchemes:
    BearerAuth:
      $ref: "../shared/components/security/bearerAuth.yaml"
