# ============================================================================ #
#                        OWS Contracts - Seagull config                        #
# ============================================================================ #
# Everything the `seagull` CLI needs to lint, bundle, generate, document, and  #
# publish the contracts lives here (from @octalmesh/seagull, see package.json) #
#                                                                              #
# Run `seagull --help` for the command list.                                   #
# ============================================================================ #

configVersion: 1

# ============================================================================ #
# Free-form tree of values used for template interpolation elsewhere in this   #
# file (generator naming, additionalProperties, ...). Nest however you like -  #
# every leaf is addressable as `{vars.<dot.path>}`.                            #
# ============================================================================ #
vars:
  org: "octalmesh"
  platform: "web"
  module: "shop"
  domain: "octalmesh.com"

  git:
    owner: "OctalMesh"
    repo: "ows-contracts"

# ============================================================================ #
# Paths - where to bundle the contracts, and which formats to bundle them in.  #
# The `dist` path is the root directory for all generated artifacts.           #
# ============================================================================ #
paths:
  dist: "dist"
  specFormat:
    - "json"
    - "yaml"

# ============================================================================ #
#  Publishing - git branch/tag naming and registry URLs for every artifact,    #
#  unless overridden per-generator (`generators.<id>.publishing`) or           #
#  per-contract-artifact (`artifacts[].overrides.publishing`).                 #
# ============================================================================ #
publishing:
  branch: "sdk/svc-{service}/{id}"
  tag: "svc-{service}-{id}-v{version}"
  repositoryUrl: "https://github.com/{vars.git.owner}/{vars.git.repo}"

  npm:
    registry: "https://npm.pkg.github.com"
    access: "public"

  maven:
    repositoryId: "github"
    repositoryUrl: "https://maven.pkg.github.com/{vars.git.owner}/{vars.git.repo}"

# ============================================================================ #
# Documentation - server host/port and metadata for the generated docs site.   #
# ============================================================================ #
docs:
  server:
    host: "localhost"
    port: 8080

  metadata:
    title: "OWS - API Reference"
    description: "API documentation for the OctalMesh Web Shop services."
    favicon: "https://octalmesh.com/favicon.ico"
    baseServerUrl: "https://octalmesh.com"

# ============================================================================ #
#  Generators - reusable "recipes": a tool + how to invoke it. Contracts pick  #
#  which of these to run, by id, under their own `artifacts:` list below.      #
# ============================================================================ #
generators:
  ts-client:
    tool: "openapi-generator"
    generator: "typescript-fetch"
    lang: "typescript"
    kind: "client"
    package: "@{vars.org}/{vars.platform}-{vars.module}-{service}-client"
    readme: "readme-templates/ts-client.md"

    additionalProperties:
      supportsES6: true
      typescriptThreePlus: true
      withInterfaces: true

  ts-server:
    tool: "openapi-typescript"
    lang: "typescript"
    kind: "server"
    package: "@{vars.org}/{vars.platform}-{vars.module}-{service}-server"

  go-client:
    tool: "openapi-generator"
    generator: "go"
    lang: "go"
    kind: "client"
    goModule: "github.com/{vars.org}/{vars.git.repo}"
    goPackageName: "{service}client"

    additionalProperties:
      withGoMod: true
      enumClassPrefix: true
      generateInterfaces: true

  go-server:
    tool: "openapi-generator"
    generator: "go-server"
    lang: "go"
    kind: "server"
    goModule: "github.com/{vars.org}/{vars.git.repo}"
    goPackageName: "{service}server"

  java-client:
    tool: "openapi-generator"
    generator: "java"
    lang: "java"
    kind: "client"

    maven:
      groupId: "com.{vars.org}.{vars.platform}.{vars.module}.{service}"
      artifactId: "{service}-client"

    additionalProperties:
      library: "restclient"
      useJakartaEe: true
      useTags: true

  java-server:
    tool: "openapi-generator"
    generator: "spring"
    lang: "java"
    kind: "server"

    maven:
      groupId: "com.{vars.org}.{vars.platform}.{vars.module}.{service}"
      artifactId: "{service}-server"

    additionalProperties:
      interfaceOnly: true
      skipDefaultInterface: true
      useSpringBoot4: true
      useTags: true

# ============================================================================ #
#  Contracts - one per service. `artifacts` picks which generators (above)     #
#  run for that service, by id. Different services may list different          #
#  generators entirely (e.g. a service-specific `java-client-legacy` recipe)   #
#  - just add it under `generators:` and reference it here.                    #
# ============================================================================ #
_contracts_defaults: &contracts_defaults
  artifacts:
    - "ts-client"
    - "ts-server"
    - "go-client"
    - "go-server"
    - "java-client"
    - "java-server"

contracts:
  - <<: *contracts_defaults
    name: "auth"
    title: "Auth Service API"
    entrypoint: "specs/auth/openapi.yaml"

  - <<: *contracts_defaults
    name: "user"
    title: "User Service API"
    entrypoint: "specs/user/openapi.yaml"

  - <<: *contracts_defaults
    name: "catalog"
    title: "Catalog Service API"
    entrypoint: "specs/catalog/openapi.yaml"

  - <<: *contracts_defaults
    name: "order"
    title: "Order Service API"
    entrypoint: "specs/order/openapi.yaml"

  - <<: *contracts_defaults
    name: "custom-order"
    title: "Custom Order Service API"
    entrypoint: "specs/custom-order/openapi.yaml"

  - <<: *contracts_defaults
    name: "payment"
    title: "Payment Service API"
    entrypoint: "specs/payment/openapi.yaml"

  - <<: *contracts_defaults
    name: "search"
    title: "Search Service API"
    entrypoint: "specs/search/openapi.yaml"

  - <<: *contracts_defaults
    name: "tracking"
    title: "Tracking Service API"
    entrypoint: "specs/tracking/openapi.yaml"

  - <<: *contracts_defaults
    name: "notification"
    title: "Notification Service API"
    entrypoint: "specs/notification/openapi.yaml"
